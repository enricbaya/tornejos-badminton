# ── Admin-first traffic shaping (docs/priority_design_plan.md, Phase 2) ──────
# This file lands directly in the http{} context (mounted as
# /etc/nginx/templates/default.conf.template, included from conf.d/*.conf by
# the base image), so limit_req_zone/limit_conn_zone are valid here even
# though there's no explicit "http {" wrapper in this file.
#
# Two independent budgets, keyed by client IP:
#   - public_read / public_conn: anonymous "/" + "/public/*" pages and the
#     authenticated-but-passive bigscreen display. Generous enough for a real
#     visitor browsing normally, but stops a single IP from flooding workers.
#   - admin_safety / admin_conn: everything else (login, dashboard, players,
#     tournaments, Django admin). Rate is high enough to never affect normal
#     admin usage — it's a safety net against a single runaway client, not a
#     throttle on legitimate admin work, which must never be delayed here.
# Returning 429 (not the nginx default 503) lets callers/clients distinguish
# "slow down" from "server is down".
limit_req_status 429;
limit_conn_status 429;
limit_req_zone  $binary_remote_addr zone=public_read:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=public_conn:10m;
limit_req_zone  $binary_remote_addr zone=admin_safety:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=admin_conn:10m;

# ── Production monitoring (docs/priority_design_plan.md, Phase 5) ───────────
# Tag every request with the same route family used for shaping above, so
# access logs can be aggregated into latency/5xx/429 rates and admin-vs-public
# split per family without adding a metrics stack. $sent_http_x_cache picks up
# the X-Cache: HIT/MISS header set by tournaments/cache_utils.py, giving a
# cache hit ratio for the three cached public views (see docs/issues/05-*.md
# for example log-analysis commands).
map $uri $route_family {
    default                                 admin;
    /                                       public;
    ~^/public/                              public;
    ~^/tournaments/[0-9]+/bigscreen/$       bigscreen;
    ~^/static/                              static;
    ~^/media/                               static;
}
log_format admin_first 'route=$route_family status=$status '
                        'rt=$request_time urt=$upstream_response_time '
                        'cache=$sent_http_x_cache method=$request_method '
                        'path="$uri" ip=$remote_addr';

server {
    listen 80;
    server_tokens off;          # don't leak nginx version in error pages / Server header
    client_max_body_size 20M;
    access_log /var/log/nginx/access.log admin_first;

    # DNS resolver injected by Docker into /etc/resolv.conf.
    # The actual IP is read at container startup by nginx-entrypoint.sh and
    # substituted here via the nginx template mechanism (envsubst).
    # Using a variable for the upstream defers hostname resolution to
    # request-time so nginx never fails to start if the web container
    # hasn't registered with Docker's DNS yet.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

    # ── Real client IP behind the Cloudflare tunnel ──────────────────────────
    # cloudflared runs on the LAN, so without this every visitor would share the
    # tunnel's IP and the per-IP rate limits above would throttle everybody at
    # once on tournament day. Only trusted local proxies may set the header.
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;

    # ── Site-wide security headers ───────────────────────────────────────────
    # These complement (and override) the ones Django emits, ensuring even
    # responses that bypass Django (static / media) carry them.
    add_header X-Content-Type-Options nosniff             always;
    add_header X-Frame-Options        DENY                always;
    add_header Referrer-Policy        same-origin         always;
    add_header Cross-Origin-Opener-Policy same-origin     always;
    # No search engine / AI crawler indexing (players are school-age children).
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;

    # ── Static / media – served directly, no Django involvement ──────────────
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Re-assert nosniff on this location (add_header replaces parent ones).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noimageindex, noai, noimageai" always;
    }

    location /media/ {
        alias /media/;
        # Force browser to download user-uploaded files instead of rendering
        # them in-place. Combined with the upload-format whitelist in the
        # TournamentForm, this is defence-in-depth against stored XSS through
        # uploaded SVG/HTML disguised as an image.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition    "attachment" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        add_header X-Robots-Tag "noindex, nofollow, noimageindex, noai, noimageai" always;
    }

    # ── Public-read: anonymous landing + spectator pages (docs/route-classification.md) ──
    location = / {
        limit_req  zone=public_read burst=20 nodelay;
        limit_conn public_conn 10;
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /public/ {
        limit_req  zone=public_read burst=20 nodelay;
        limit_conn public_conn 10;
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Public-read (authenticated): passive bigscreen display, never writes,
    # auto-reloads every 60s client-side — shaped like public-read, but auth
    # is still enforced by Django's @login_required (no caching here: caching
    # an owner-scoped response at this layer could leak one club's tournament
    # data to another authenticated user requesting the same URL).
    location ~ ^/tournaments/[0-9]+/bigscreen/$ {
        limit_req  zone=public_read burst=10 nodelay;
        limit_conn public_conn 10;
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Admin-critical (default bucket): login, dashboard, players, tournaments,
    # Django admin. No throttling of legitimate use — the limit below is a
    # safety net against a single misbehaving client, set far above normal
    # human/browser request rates.
    location / {
        limit_req  zone=admin_safety burst=60 nodelay;
        limit_conn admin_conn 30;
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
